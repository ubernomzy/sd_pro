; SD Pro clock - custom firmware
; Chip: ESP8266, 4MB flash, same layout as the seller's firmware
; (about 1MB for firmware, 3MB file system).

[env:sdpro]
platform = espressif8266
board = esp12e
framework = arduino
board_build.ldscript = eagle.flash.4m3m.ld
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
monitor_speed = 115200
build_flags =
  -D FW_VERSION=\"0.4.2\"
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.0
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0

; Optional: upload straight from PlatformIO over WiFi once our firmware
; is on the clock.  Set the password first in your terminal:
;   export SDPRO_OTA_PASSWORD='the OTA_PASSWORD from secrets.h'
;   pio run -e sdpro_wifi -t upload
[env:sdpro_wifi]
extends = env:sdpro
upload_protocol = espota
upload_port = sdpro.local
upload_flags =
  --auth=${sysenv.SDPRO_OTA_PASSWORD}
