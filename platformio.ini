; SD Pro clock - custom firmware
; Chip: ESP8266, 4MB flash, same layout as the seller's firmware
; (about 1MB for firmware, 3MB file system).

[env:sdpro]
platform = espressif8266
board = esp12e
framework = arduino
board_build.ldscript = eagle.flash.4m3m.ld
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
monitor_speed = 115200
build_flags =
  -D FW_VERSION=\"0.9.0\"
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.0
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0
  bblanchon/ArduinoJson@^7.0.0
; Stops the build if firmware.bin is too big to update over WiFi later.
extra_scripts = post:check_size.py
